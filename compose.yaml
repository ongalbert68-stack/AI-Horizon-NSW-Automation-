services:
  postgres:
    image: docker.io/library/postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ai_horizon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ai_horizon}
      POSTGRES_DB: ${POSTGRES_DB:-ai_horizon_nsw}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ai_horizon} -d ${POSTGRES_DB:-ai_horizon_nsw}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
